# DDoS Protection & Security Hardening
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
}

http {
    # DDoS Protection: Rate limiting per IP
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m 5;

    # Connection timeouts to prevent slowloris
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 5s;
    send_timeout 10s;

    # Buffer size limits to prevent buffer overflow
    client_body_buffer_size 1k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # Hide nginx version
    server_tokens off;

    # Upstream NSFW Firewall Engine
    upstream nsfw_backend {
        server nsfw-firewall:8080 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    server {
        listen 80;
        listen 443 ssl http2;
        server_name localhost;

        # SSL configuration
        ssl_certificate /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # General rate limiting
        limit_req zone=general_limit burst=20 nodelay;
        limit_conn zone=conn_limit;

        # Health check (no auth required)
        location /health {
            proxy_pass http://nsfw_backend/health;
            access_log off;
        }

        # API endpoints with stricter rate limiting
        location /v1/ {
            limit_req zone=api_limit burst=50 nodelay;
            limit_req_status 429;

            proxy_pass http://nsfw_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeout settings
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Metrics (restricted network)
        location /metrics {
            allow 172.20.0.0/16;  # Docker network only
            deny all;

            proxy_pass http://nsfw_backend/metrics;
        }
    }
}
