quantization:
  premium_vit:
    default: fp16
    optional_int8:
      enabled: false  # enable after calibration
      calibration:
        dataset: "representative_calibration_dataset"
        steps: 1000
        metrics:
          accuracy_drop_threshold: 0.01  # max allowed drop vs FP16
      evaluation:
        metrics:
          - latency_ms
          - throughput_qps
          - memory_mb
        criteria:
          latency_ms: "< 100"
          throughput_qps: ">= 200"
          memory_mb: "<= 1500"
          accuracy_drop_threshold: "< 0.01"
