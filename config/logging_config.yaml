# =============================================================================
# Structured (JSON) logging configuration.
# Loaded by app.core.logging_setup using logging.config.dictConfig.
# =============================================================================
version: 1
disable_existing_loggers: false

formatters:
  json:
    # Custom formatter that emits one JSON object per line.
    "()": "app.core.logging_setup.JsonFormatter"
    fields:
      - timestamp
      - level
      - logger
      - message
      - module
      - funcName
      - lineno
    rename:
      asctime: timestamp
      levelname: level
      name: logger

handlers:
  console:
    class: "logging.StreamHandler"
    level: "INFO"
    formatter: json
    stream: "ext://sys.stdout"

  file:
    class: "logging.handlers.RotatingFileHandler"
    level: "DEBUG"
    formatter: json
    filename: "logs/nsfw_engine.log"
    maxBytes: 10485760
    backupCount: 5
    encoding: "utf-8"

loggers:
  nsfw_engine:
    level: "DEBUG"
    handlers: ["console", "file"]
    propagate: false
  app:
    level: "DEBUG"
    handlers: ["console", "file"]
    propagate: false

root:
  level: "WARNING"
  handlers: ["console"]
