# ModSecurity Configuration for NSFW Firewall Engine
# Based on OWASP Core Rule Set (CRS)

SecRuleEngine On
SecRequestBodyAccess On
SecResponseBodyAccess Off
SecResponseBodyMimeType text/plain text/html

# Logging
SecAuditLog /var/log/modsecurity/audit.log
SecDebugLog /var/log/modsecurity/debug.log
SecDebugLogLevel 0

# Request body limits
SecRequestBodyLimitAction ProcessPartial
SecRequestBodyNoFilesLimit On
SecRequestBodyLimit 13107200  # 20 MB (matches application limit)

# Include OWASP CRS
Include /etc/modsecurity.d/owasp-crs/crs-setup.conf
Include /etc/modsecurity.d/owasp-crs/rules/*.conf

# Custom rules for NSFW Firewall Engine
# Allow classification endpoints with proper authentication
SecRule REQUEST_URI "@rx ^/v1/(classify|enforce|classify-text|inspect)" \
    "id:1001,phase:1,allow,msg:'NSFW API endpoints allowed through WAF'"

# Block direct access to admin endpoints without IP whitelist
SecRule REQUEST_URI "@rx ^/(config|audit|me|model-status)" \
    "id:1002,phase:1,deny,status:403,msg:'Admin endpoint blocked - require VPN or internal network'"
