# Basic ModSecurity configuration for NSFW Firewall Engine
SecRuleEngine On
SecRequestBodyAccess On
SecResponseBodyAccess Off
SecResponseBodyMimeType text/plain text/html

# Log files
SecAuditLog /var/log/modsecurity/audit.log
SecDebugLog /var/log/modsecurity/debug.log

# Basic rule set
Include /etc/modsecurity.d/owasp-crs.conf

# Custom rules for NSFW Firewall Engine
SecRule REQUEST_URI "@rx ^(\/v1\/classify|\/v1\/enforce)" \
    "id:1001,phase:1,deny,status:403,msg:'Direct API access blocked through WAF'"

# Limit request body size
SecRequestBodyLimitAction ProcessPartial
SecRequestBodyNoFilesLimit On
SecRequestBodyLimit 13107200  # 20 MB
