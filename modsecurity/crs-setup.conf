# OWASP CRS Setup Configuration for NSFW Firewall Engine
# This file configures the OWASP Core Rule Set behavior

# Default action for rules
SecDefaultAction "phase:1,log,auditlog,deny,status:403"

# Anomaly Score Mode - block when anomaly score >= 5
SecAction \
  "id:900000,\
   phase:1,\
   nolog,\
   pass,\
   t:none,\
   setvar:tx.anomaly_score_threshold=5"

# paranoia_level: 1 (low) to 4 (paranoid)
# Level 1 provides good protection with minimal false positives
SecAction \
  "id:900001,\
   phase:1,\
   nolog,\
   pass,\
   t:none,\
   setvar:tx.paranoia_level=1"

# Reduce false positives for API traffic
# Allow JSON payloads
SecRule REQUEST_HEADERS:Content-Type "@rx application/json" \
  "id:900010,\
   phase:1,\
   nolog,\
   pass,\
   t:none,\
   ctl:requestBodyProcessor=JSON"

# Allow Base64 encoded payloads (for image uploads)
SecRule REQUEST_URI "@rx ^/v1/" \
  "id:900011,\
   phase:1,\
   nolog,\
   pass,\
   t:none,\
   ctl:requestBodyProcessor=URLENCODED"

# Disable some noisy rules for API traffic
# SQL Injection: allow specific API parameters
SecRule ARGS:media_type "@rx ^IMAGE|VIDEO|TEXT|HTML$" \
  "id:900020,\
   phase:2,\
   nolog,\
   pass,\
   t:none,\
   ctl:ruleRemoveById=941100"

# XSS: allow text/image URLs
SecRule ARGS:url "@rx ^https?://" \
  "id:900021,\
   phase:2,\
   nolog,\
   pass,\
   t:none,\
   ctl:ruleRemoveById=941100"

# Increase request body size for API
SecAction \
  "id:900030,\
   phase:1,\
   nolog,\
   pass,\
   t:none,\
   setvar:tx.max_http_args=512"
