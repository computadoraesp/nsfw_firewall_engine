[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nsfw-firewall-engine"
version = "1.0.0"
description = "NSFW content classification and proxy enforcement service"
readme = "README.md"
license = { file = "LICENSE" }
requires-Python = ">=3.11"
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "httpx==0.27.2",
]
model-export = [
    "huggingface_hub>=0.27,<2",
    "safetensors>=0.4,<1",
    "timm>=1.0,<2",
    "torch>=2.5,<3",
    "torchvision>=0.20,<1",
    "transformers>=4.31,<5",
]
fp16-export = [
    "onnxconverter-common>=1.14,<2",
]

[project.scripts]
nsfw-firewall-rest = "app.main:main"
nsfw-firewall-icap = "app.api.icap.icap_server:main"
nsfw-firewall-grpc = "app.api.grpc.server:serve"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["."]
include = [
    "app*",
    "adapters*",
    "benchmarks*",
    "content*",
    "firewall*",
    "models*",
    "policy*",
    "proto*",
]
namespaces = true

[tool.setuptools.package-data]
firewall = ["*.yaml"]
proto = ["*.proto"]

[tool.setuptools.data-files]
config = ["config/*.yaml"]
models_onnx = ["models_onnx/README.md"]
