apiVersion: v1
kind: Service
metadata:
  name: nsfw-firewall
  labels:
    app: nsfw-firewall
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  - port: 9090
    targetPort: 9090
    protocol: TCP
    name: grpc
  selector:
    app: nsfw-firewall
