# Prometheus Configuration for NSFW Firewall Engine

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'nsfw-firewall'
    environment: 'production'

scrape_configs:
  # NSFW Firewall Engine metrics (via Docker network)
  - job_name: 'nsfw-firewall'
    static_configs:
      - targets: ['nsfw-firewall:8080']
    metrics_path: '/metrics'
    scheme: http
    # Metrics token is set via environment variable in app
    # Do not expose token in config - use NSFW_METRICS_TOKEN env var

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

alerting:
  alertmanagers:
    - static_configs:
        - targets: []
          # - alertmanager:9093

# Alert rules
rule_files:
  - 'alerts.yml'
