version: 2
updates:
  # Enable version updates for Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    # Allow security-only updates for high-severity CVEs
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "deps"
      include: "scope"
    # Group minor and patch updates together
    groups:
      dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "torch*"
          - "onnx*"
        update-types:
          - "minor"
          - "patch"

  # Enable version updates for Docker
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    labels:
      - "docker"
      - "dependencies"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    labels:
      - "github-actions"
      - "dependencies"

# Configure security alerts
alerts:
  - security-updates
    # Only show critical and high severity alerts
    ignore:
      - dependency-name: "torch*"
        update-types: ["version-update:semver-patch"]
      - dependency-name: "onnx*"
        update-types: ["version-update:semver-patch"]
