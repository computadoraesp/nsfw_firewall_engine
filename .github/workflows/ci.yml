name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff flake8 pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint with ruff
        run: ruff .

      - name: Lint with flake8
        run: flake8 .

      - name: Run unit tests
        run: pytest tests/ -v

      - name: Run security tests
        run: pytest tests/test_redteam*.py -v

      - name: Build Docker image
        run: |
          docker build -t nsfw-firewall:ci .

      - name: Validate model lockfile
        run: |
          python scripts/verify_models.py

      - name: Production gate check
        run: |
          python scripts/production_gate.py || echo "Production gate failed (expected in dev mode)"

      - name: Smoke test in container
        run: |
          docker run -d --name nsfw-test -p 8080:8080 nsfw-firewall:ci
          sleep 10
          curl -f http://localhost:8080/health || exit 1
          docker rm -f nsfw-test
