# Prometheus scrape config for the NSFW Firewall Engine (docker-compose).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: nsfw-firewall-engine
    metrics_path: /metrics
    static_configs:
      - targets: ["engine:8080"]
        labels:
          service: nsfw-firewall-engine
          component: triage-classifier