{{- if .Values.config.create }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nsfw-firewall.fullname" . }}-config
  labels:
    {{- include "nsfw-firewall.labels" . | nindent 4 }}
data:
  # Rendered from .Values.config.engine / .Values.config.logging. When this is
  # left empty the chart relies on the config baked into the image and mounts no
  # volume, so the default install always works.
  engine_config.yaml: |
{{ .Values.config.engine | default "{}" | indent 4 }}
  logging_config.yaml: |
{{ .Values.config.logging | default "{}" | indent 4 }}
---
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nsfw-firewall.serviceAccountName" . }}
  labels:
    {{- include "nsfw-firewall.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- if .Values.highAvailability.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "nsfw-firewall.fullname" . }}
  labels:
    {{- include "nsfw-firewall.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.highAvailability.minAvailable }}
  selector:
    matchLabels:
      {{- include "nsfw-firewall.selectorLabels" . | nindent 6 }}
{{- end }}