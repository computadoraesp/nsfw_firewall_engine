version: "3.9"

services:
  app:
    build: .
    image: nsfw-firewall:latest
    container_name: nsfw-firewall-app
    ports:
      - "8000:8000"
    environment:
      - NSFW_ENGINE_CONFIG=/app/config/engine_config.yaml
      - NSFW_API_KEYS={}
    volumes:
      - ./models_onnx:/app/models_onnx:ro
      - ./config:/app/config:ro
    depends_on:
      - prometheus
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: nsfw-firewall-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: nsfw-firewall-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./deploy/grafana:/var/lib/grafana:ro
    depends_on:
      - prometheus
    restart: unless-stopped
